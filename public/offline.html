<!-- public/offline.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>You're Offline — Entre PRO Market</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    img { width: 90px; margin-bottom: 20px; }
    h1 { font-size: 20px; color: #333; margin: 0 0 8px; }
    p { color: #888; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
    button {
      padding: 12px 24px;
      background: #701890;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo-circle.png" alt="Entre PRO Market" />
    <h1>You're Offline</h1>
    <p>This page hasn't been loaded before, so it's not available right now. Pages and images you've already viewed will still work — check your Home or Marketplace tab, or reconnect and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
